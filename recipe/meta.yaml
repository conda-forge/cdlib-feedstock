{% set name = "cdlib" %}
{% set version = "0.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cdlib-{{ version }}.tar.gz
  sha256: b9abb979add9451064c391a37acb517a7753f999fa76d90f400aeab018d2a334

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - matplotlib-base
    - scikit-learn
    - tqdm
    - networkx >=3.0
    - demon
    - python-louvain >=0.16
    - nf1
    - scipy
    - pulp
    - seaborn
    - pandas
    - eva-lcd
    - bimlpa
    - markov-clustering
    - python-igraph >=0.10
    - angelcommunity
    - pooch
    - dynetx
    - thresholdclustering
    - python-levenshtein

test:
  imports:
    - cdlib
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/GiulioRossetti/cdlib
  summary: Community Discovery Library
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mediocretech
